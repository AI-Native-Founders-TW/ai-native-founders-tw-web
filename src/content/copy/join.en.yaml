# /en/join copy. Same keys as join.zh-tw.yaml; anything missing falls back to Chinese.
# Rules: no background or track-record requirements; no promised review times; nothing from unadopted "Note" ideas.

meta:
  title: Join · AI-Native Global Founders Speedrun Taiwan
  description: The only way in is an honest self-introduction, submitted as a pull request. Four steps, straight answers, and an intro builder that runs entirely in your browser.

hero:
  kicker: Join · The route in
  title: One honest intro.
  titleAccent: That's your starting line.
  body: The only requirement is a self-introduction submitted as a pull request. We look for sincerity, not background, résumé or track record. No project yet? Still figuring it out? Say so.
  ctaPrimary: Write your intro
  ctaSecondary: Read how applying works
  facts:
    - k: Cost
      v: Free to join
    - k: To join
      v: One intro PR
    - k: We look for
      v: Sincerity, not pedigree

steps:
  kicker: Route · Four checkpoints
  title: Four steps to the finish line.
  body: Starring the repo and joining the event thread are welcome but optional. Membership starts once your intro PR is approved.
  open: Open
  final: Finish

builder:
  kicker: Intro builder
  title: Follow the template, one field at a time.
  body: Use this tool to draft your introduction. Before submitting, check Members/README and the official application policy for current requirements and complete any missing information. Markdown updates live on the right. When you're ready, the button opens GitHub's new-file page; you review it and open the PR yourself.
  privacy: The builder runs only in your browser and sends nothing anywhere. Your draft stays in this browser. Nothing is public until you submit it on GitHub.
  groups:
    - id: you
      title: About you
    - id: why
      title: Why you're here
    - id: rnr
      title: What you can and want to help with
      note: Describe what you can and want to help with so others can find collaborators. This does not commit you to specific work. Follow Members/README and the official application policy for the full introduction and responsibility requirements.
  fields:
    name:
      label: Name, or what people call you
      placeholder: e.g. Alex
    github:
      label: GitHub username
      hint: Used to suggest the file name (<username>.md). A convenience, not a requirement.
      placeholder: your-github
    about:
      label: Who you are
      hint: What you're working on and what you care about. Founding, building, employed, studying or still exploring — all fine, just be honest.
      placeholder: e.g. Ex-Taipei PM, now building a dev tool in SF…
    contact:
      label: Other contact or links to your work
      hint: Only what you're happy to make public.
      placeholder: https://
    why:
      label: Why you want to join
      hint: A recent problem, an experience, or something you want to try.
    seek:
      label: What you hope to get
      hint: What do you most want to figure out or learn, or who do you want to meet? The more specific, the easier it is for people to reach out.
    share:
      label: What you can share
      hint: Experience, stories, know-how, or what you're trying right now. Unfinished is fine.
    canHelp:
      label: What you can help with
      hint: Concretely, what you can help with today and how much. One per line.
      placeholder: "- Fundraising decks\n- Intro to US incorporation"
    wantHelp:
      label: What you want to help with
      hint: Activities or work you'd like to join, or things you want to learn by doing. One per line.
      placeholder: "- Answering questions from Taiwanese founders\n- Hosting a talk"
  optional: optional
  preview: Preview
  filename: File
  copy: Copy Markdown
  copied: Copied
  reset: Clear
  resetConfirm: Clear every field?
  progress: Done
  missing: Still empty
  review: Before you submit, read every line yourself to make sure it's true and contains nothing you don't want public. The full requirements are in the submission steps of Members/README.
  confirm: I've reviewed the whole thing myself. It's accurate and has nothing I don't want public.
  submit: Create my intro on GitHub
  submitHint: Opens GitHub in a new tab (sign-in required). If you don't have write access, GitHub forks the repo for you; then click "Propose new file" → "Create pull request".
  tooLong: This is long; GitHub may not carry all of it over. If the page is empty, copy the Markdown and paste it in.
  guide: Prefer doing it by hand? Follow Members/README

faq:
  kicker: FAQ
  title: Straight answers.
  sources: Source
  items:
    - q: I have no track record and no project. Can I join?
      a: Yes. Background, skill and experience are not conditions for joining; we only look at intent. A sincere intro from someone with no experience and no project is welcome. If you're still working out whether founding is for you, just say that.
      refs: [constitution, application]
    - q: Can I write my intro with AI?
      a: Yes — that's completely normal. Review is about sincerity, not writing quality. Just read the whole thing yourself before submitting, so nothing invented or overcommitted slips in, and nothing you'd rather keep private.
      refs: [application, membersGuide]
    - q: Does joining Discord make me a member?
      a: No. Membership comes from an approved intro PR. Discord is where people talk, join events and find collaborators; you'll be invited, but it isn't a requirement. Same for starring the repo or posting in the event thread.
      refs: [application]
    - q: Do I have to help out once I'm in?
      a: No. Everyone is a volunteer, and nobody is forced to take on work. Participation and responsibility arrangements follow the official member participation policy. Describing what you can and want to help with does not commit you to specific work.
      refs: [constitution, participation]
    - q: Does it cost anything to join?
      a: No. The only step to join is a self-intro PR. There are no paid placements in notes or events, and we never promote anyone's company.
      refs: [application, constitution]
    - q: I've never used GitHub. Now what?
      a: Follow Members/README for the current submission steps and location. You can draft with the builder above, then check and complete the official requirements. Stuck? Ask in Discord.
      refs: [membersGuide, discord]
    - q: How long does review take, and who reviews?
      a: Reviewers, process and permissions follow the official application policy. This page does not promise a turnaround. Opening the PR is your application; if anything needs adding, you'll see review comments on the PR.
      refs: [application, review]
  refLabels:
    constitution: Constitution
    application: Application process
    membersGuide: Members/README
    participation: Member participation
    review: Intro review
    discord: Discord

event:
  kicker: Happening now
  cta: Add your question
