faq:
  kicker: FAQ
  title: 你可能想問的。
  sources: 依據
  items:
    - q: 我沒有經歷、沒有專案，可以加入嗎？
      a: 可以。我們不以背景、實力或經歷作為加入條件，只看意圖。自介真誠、值得信任，但沒有經歷、沒有專案的人，可以加入；還在探索創業志向，也可以如實說明。
      refs: [constitution, application]
    - q: 自介可以用 AI 寫嗎？
      a: 可以，自介由 AI 寫是很正常的；審查看的是內容有沒有真誠，不看文章品質。提交前請你本人 review 全文，確認沒有 AI 編造的經歷或參與承諾，也沒有不願公開的個資。
      refs: [application, membersGuide]
    - q: 加入 Discord 就算成員嗎？
      a: 不算。成員資格以自介 PR 審查通過為準。Discord 是大家交流、參與活動與找人協作的地方，我們會邀請你，但它不是門檻；Star 與活動留言也一樣，依意願參與。
      refs: [application]
    - q: 加入後一定要幫忙嗎？
      a: 不用。所有成員都是志工，組織不強制任何人承擔工作。成員應有基本的參與度、不要全程潛水，具體標準還在討論。自介裡的 R&R 是你的意願，不是承諾。
      refs: [constitution, participation]
    - q: 加入要收費嗎？
      a: 不用。加入的唯一門檻是提交自介 PR。我們也不在筆記或活動中收錢置入、不為任何公司推銷。
      refs: [application, constitution]
    - q: 我不會用 GitHub 怎麼辦？
      a: 照 Members/README 的步驟就可以：登入 GitHub、Fork、在 Members/ 新增自介、開 PR。也可以用上面的自介產生器，它會直接帶你到 GitHub 建立檔案的頁面。卡住了，就到 Discord 發問。
      refs: [membersGuide, discord]
    - q: 審查多久？誰審？
      a: 老實說：尚未決定。審查人、審查程序與權限安排都還在討論，所以我們不承諾處理時間。PR 送出就是提出申請；如果需要補充，你會在 PR 上看到審查意見。
      refs: [review]
  refLabels:
    constitution: 憲法
    application: 申請制度
    membersGuide: Members/README
    participation: 成員參與制度
