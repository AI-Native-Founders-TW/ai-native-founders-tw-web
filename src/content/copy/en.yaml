# Homepage copy (English). Same key structure as zh-tw.yaml; any missing key falls back to Chinese.
# Audience: Silicon Valley founders and investors, and international founders. Write like a person, not a translation.
# Rules: nothing from unadopted "Note" ideas as if it were a service; no background or track-record requirements (constitution art. 11).

