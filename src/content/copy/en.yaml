coffeeChat:
  arrowLabel: Help
  topics: null
  file: notes/coffee-chat.md
  kicker: Split 02 · Once is enough
  title: Nobody should have to answer the same question a hundred times.
  body: Every new founder starts networking from scratch and runs the same round of coffee chats, and the people who've been there answer the same questions again and again. We turn each conversation into open notes, so one chat helps a hundred founders.
  bubbles:
    - How do I set up a company in the US?
    - What capital do I declare for a Taiwan company?
    - Where do I find angel investors?
    - What belongs in a funding plan?
    - How do I do small talk in the Valley?
    - B2B or B2C — what actually changes?
    - I've built it. How do I find distribution?
    - What am I not even thinking about?
  note: One set of open notes
  stat: 1 conversation → N founders

voyage:
  kicker: Going global
  title: From Taiwan, grow in Silicon Valley.
  body: Build traction, plan your funding, develop connections, and relocate. Together, we share practical experience so founders can understand their stage and decide what to focus on next.
  origin: Taiwan · Starting out
  destination: Silicon Valley · Growing
  railOrigin: Taiwan
  goal: Grow in Silicon Valley
  checkpoints:
    - name: Traction
      detail: Validate demand through customer usage, payments, and retention.
    - name: Funding Plan
      detail: Define your next milestone, the funding it needs, and how long that funding will last.
    - name: Connections
      detail: Build lasting relationships with customers, founders, and investors.
    - name: Relocation
      detail: Arrange life and work, adapt to the culture, and keep building your business locally.
  footnote: Share practical experience and turn it into open-source Agent Skills. Connections and funding planning can develop in parallel; we do not promise introductions or matchmaking.
  railLabel: Stages of building abroad

skillTree:
  kicker: Split 04 · Builds
  title: There's no single way to build a company. There are builds.
  body: Like a game guide — different founder-market fit, team composition and industry lead to different fastest routes. We want to turn hard numbers and lived experience into a skill tree.
  status: Work in progress
  sample: Example
  branches:
    - id: fmf
      name: Founder-Market Fit
      hint: What superpower does your background set you up for?
    - id: team
      name: Team composition
      hint: How different founding-team skill mixes play out.
    - id: industry
      name: Industry
      hint: Build on Taiwan's strengths, or go pure software.
  builds:
    - id: fmf-build
      branch: fmf
      name: The superpower build
      for: Founders working out which superpower their background suits
      cost: Still mapping
      grind: "Grind: still mapping"
    - id: team-build
      branch: team
      name: The team-combo build
      for: Founders looking for the right mix of skills in a founding team
      cost: Still mapping
      grind: "Grind: still mapping"
    - id: tw-advantage
      branch: industry
      name: The Taiwan-advantage build
      for: Founders building on Taiwan's strengths, or going pure software
      cost: Still mapping
      grind: "Grind: still mapping"
  cta: Help map the builds

character:
  kicker: Split 05 · Pick your starting point
  title: You don't have to be ready.
  body: We look for sincerity — not background, skill or résumé.
  prompt: Pick the class that fits you best
  classes:
    - id: student
      name: Student
      line: Still in school, not sure founding is for you? Perfect. Come meet people and find out whether you can build something great.
    - id: pm
      name: New PM
      line: You make product calls every day — you just haven't pictured yourself as a founder yet. Come see how others are thinking about it.
    - id: employee
      name: Still employed
      line: You don't have to quit to start. Join at your own pace; share when you want, learn when you want.
    - id: founder
      name: Founder
      line: Bring the fight you're in right now. Your experience is exactly the know-how someone else needs.
    - id: senior
      name: Valley veteran
      line: One conversation with you becomes open notes the next hundred Taiwanese founders can learn from. That's why we started as a media project first.
  ui:
    keys: ← → to switch　Enter to pick
    swipe: Swipe to see other starting points
    selected: Your starting point

aiNative:
  # 翻譯：依 zh-tw 的 aiNative 翻成英文，尚未經拍板
  kicker: Why AI-Native?
  title: Exploring AI-Native together, so Taiwan keeps producing founders who build for the world.
  body: Artificial general intelligence (AGI) may be about to arrive. For Taiwanese people who want to build globally, now is the time to explore AI together and raise what we can actually do. From the organization itself, to the product itself, to product design and development, we explore how AI-Native can unlock what founders are capable of.
  layers:
    - name: The organization itself
      body: This organization itself collaborates with heavy use of shared context and AI-Native ways of running and building. As you take part in it, you're welcome to learn with us how AI-Native can help an organization decentralize to a degree. That lets everyone propose their own plans and contributions at any time, keeping specs, plans and knowledge in a shared mono repo and shared context, so AI can help everyone run the organization more efficiently.
      link: GitHub · mono
      tags:
        hub: Shared context
        items: [Specs, Plans, Knowledge]
    - name: The product itself
      body: We encourage everyone to build AI-Native products, creating Agent as a Service in every field, reaching outstanding results with AI, and building together products that can compete globally.
      tags:
        items: [Every field, Agent as a Service, Product]
    - name: Product design and development
      body: Learning together how to work the AI-Native way, from market research, product design, pitch decks and funding plans to spec-driven development, so founding teams know the full AI-Native approach to designing and building products. Using AI to amplify how we organize information, unlocking a hundredfold of human potential, and using that methodology to leapfrog.
      tags:
        items: [Market research, Product design, Pitch deck, Funding plan, Spec-driven development]
  weave: Explore together. Practice together.
  close:
    title: Let Taiwan keep producing AI-Native founders.
    body: Through ongoing exchange and shared practice, we want to raise how well Taiwanese founders use AI, so more of them are ready to compete abroad, and to advance practice across Taiwan's AI industry. We hope to deliver outstanding results from the bottom up, so the government sees what Taiwanese startups can do, and that in turn shapes its international strategy.
    outcomes:
      - Raise competitiveness abroad
      - Advance practice across Taiwan's AI industry

notDo:
  kicker: Split 07 · What we don't do
  title: Some things we choose not to do.
  items:
    - No membership fee. The only step to join is a self-intro PR.
    - No selling. We never use our name, notes or events to promote anyone's product.
    - No paid placement. No ads or paid recommendations in our notes or events.

finish:
  kicker: Split 08 · Finish line
  title: Your run starts here.
  body: The only requirement is an honest introduction. No impressive résumé or finished project needed — if you're still exploring, just say so.
  steps:
    - name: Join Discord
      detail: Where people talk, join events and find collaborators. It's an invitation, not a requirement.
      link: discord
    - name: Star the repo on GitHub
      detail: A star supports the open notes and makes it easy to find your way back.
      link: mono
    - name: Read three documents
      detail: The founder's letter, the constitution and the application process — what we're doing, the principles we share, and how to join.
      link: founderWords
    - name: Submit your intro as a PR
      detail: Who you are, why you're joining, what you hope to get, what you can share, and what you can and want to help with. Once it's approved, you're a member.
      link: membersGuide
