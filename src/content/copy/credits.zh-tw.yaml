howto:
  title: 怎麼把自己加進來
  items:
    - k: 寫程式
      v: commit 進本 repo 或 mono，下次建置自動出現。
    - k: 設計、文案、討論
      v: 在 PR 裡順手把自己加進 src/content/credits.yml 的 website.roles。
    - k: 頭像
      v: 在 credits.yml 填上你的 GitHub 帳號，就會換成 GitHub 頭像。
    - k: 名字對不上
      v: 同一個人有不同稱呼時，在 credits.yml 的 aliases 合併。
  cta: 編輯 credits.yml
