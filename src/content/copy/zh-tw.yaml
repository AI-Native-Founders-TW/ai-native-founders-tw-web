aiNative:
  # plans/002-revise-LP-copywriting-by-水球（文案修改計畫）：三層含義與台灣願景；本區文案待使用者採納
  kicker: 為什麼是 AI-Native？
  title: 一起鑽研 AI-Native，讓臺灣持續走出面向全球的創業者。
  body: 通用型人工智慧 (AGI) 也許即將誕生。對想在全球創業的臺灣人而言，現在就是一起鑽研 AI、提升實踐能力的時刻。我們從組織本身、產品本身，到產品的設計和開發，探索 AI-Native 如何解鎖創業者的潛能。
  layers:
    - name: 組織本身
      body: 這個組織本身的協作方式，就大量採用 shared context 加上 AI-Native 的經營及開發方式。歡迎大家在參與這個組織的過程中，一起學習 AI-Native 如何幫助一個組織進行一定程度的去中心化。這樣能讓大家隨時提出自己的企劃和貢獻，把規格、計畫、知識都放在共同的 mono repo 與共同脈絡裡，讓 AI 協助大家把組織運作得更有效率。
      link: GitHub · mono
      # 畫面標籤（裝飾，內容都在上面的說明裡）
      tags:
        hub: 共同的脈絡
        items: [規格, 計畫, 知識]
    - name: 產品本身
      body: 鼓勵大家開發 AI-Native 的產品，在各個領域打造 Agent as a Service，透過 AI 達成卓越的智慧成效，一起做出能在全球競爭的產品。
      tags:
        items: [各個領域, Agent as a Service, 產品]
    - name: 產品的設計和開發
      body: 一起鑽研如何用 AI-Native 的方式，從市場調查、產品設計、Pitch Deck、Funding Plan 到規格驅動開發，讓 founding team 熟悉整套 AI-Native 的產品設計及開發方式。透過 AI 放大自己的資訊組織效率，做到放大人類百倍的潛能，以此卓越的方法論彎道超車。
      tags:
        items: [市場調查, 產品設計, Pitch Deck, Funding Plan, 規格驅動開發]
  weave: 一起鑽研，共同實踐。
  close:
    title: 讓臺灣持續輸出 AI-Native founders。
    body: 透過持續交流與共同實踐，提升臺灣創業者運用 AI 的能力，讓更多人具備出海競爭力，也帶動臺灣 AI 產業的實踐水平。我們希望以 bottom-up 的方式做出卓越成效，讓政府看見臺灣新創的可能性，進而影響國際布局的策略。
    outcomes:
      - 提升出海競爭力
      - 帶動臺灣 AI 產業實踐

