coffeeChat:
  arrowLabel: 幫助
  kicker: 全球創業的問題
  title: 一起探索，臺灣創業者如何在全球創造成功。
  body: 從「臺灣出海創業者須知 101（出海創業入門）」開始，了解自己在哪個階段、該專注什麼。與已成功出海的創業者交流，把創業的戰術策略、成功與失敗故事，整理成開源的 Agent Skills，系統化地傳承知識。
  bubbles:
    - 我在哪個創業階段，現在最該驗證什麼？
    - Founder-market fit：為什麼是我來做這個市場？
    - AI-Native 創業：哪個工作流程值得客戶付費？
    - 去美國前，哪些資源能幫我接觸第一批客戶？
    - Funding plan：這輪資金要換到什麼里程碑？
    - Pitch deck：為什麼是現在，憑什麼是我們？
    - 矽谷 networking：一次交流後，如何建立長期互信？
    - 融入美國文化：如何有自信地表達，也聽懂回饋？
    - 每年出海的成敗：哪些經驗可複製，哪些有條件？
  topics:
    - 臺灣出海創業者須知 101（出海創業入門）
    - Founder-market fit
    - AI-Native 創業的實踐
    - 去美國立即可用的資源
    - Funding plan 的戰術策略
    - Pitch deck 的撰寫方式
    - 矽谷 networking 的戰術模式
    - 融入美國文化、培養自信
    - 每一年出海的成功與失敗故事
  file: Agent Skills
  note: 開源的 Agent Skills
  stat: 1 次交流 → N 位創業者

voyage:
  kicker: 出海
  title: 從臺灣出發，在矽谷持續成長。
  body: 從取得市場驗證、規劃資金，到建立人脈、落地矽谷。我們一起整理每個階段的戰術策略與前輩經驗，讓臺灣創業者知道自己在哪個階段、接下來該專注什麼。
  origin: 臺灣 · 出發
  destination: 矽谷 · 發展
  railOrigin: 臺灣
  goal: 在矽谷持續成長
  checkpoints:
    - name: 市場驗證
      detail: 用客戶的使用、付費與留存，確認產品是否有市場需求。
    - name: 資金規劃
      detail: 下一階段要達成什麼？需要多少資金、能支撐多久？
    - name: 建立人脈
      detail: 與客戶、創業者及投資人建立長期關係，讓交流有後續。
    - name: 落地矽谷
      detail: 安排生活與工作、適應文化，讓事業能在當地持續經營。
  footnote: 一起交流各階段的戰術策略，整理成開源的 Agent Skills。人脈與資金規劃可以同時進行；我們不承諾引薦或媒合。
  railLabel: 出海創業的階段

