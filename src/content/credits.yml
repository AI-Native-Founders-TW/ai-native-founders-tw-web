# 網站的非程式貢獻與身分合併。
#
# 程式貢獻（git commit）、組織文件的資訊貢獻者、自介都會自動算進 /credits，不必寫在這裡。
# 這份檔案只補兩件 git 看不到的事：
#   1. people：同一個人在不同地方的稱呼（別名）與 GitHub 帳號，用來合併成同一人。
#   2. website.roles：設計、文案、討論等不會出現在 git 紀錄的貢獻。
# 你修了文案或設計，在 PR 裡順手把自己加進對應的 role 即可。
#
# 規則：
# - GitHub 帳號請本人提供；不知道就留空，不要猜。
# - emails 只填本人確認過、用來 commit 的 email（讓 git 作者合併到這個人）。
# - 出處：Owner／Collab／Logo 為 2026-10-24 Discord 水球公布；A5、A12、A13 為第一次核心會議行動表。

