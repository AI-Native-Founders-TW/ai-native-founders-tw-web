# aifounders.tw：main 有更新就 build，發佈成 GitHub Release（固定 tag：site-build）；PR 只做 build 檢查，不發佈。
# 放在網站 repo 的 .github/workflows/release-site.yml。這份 workflow 不碰主機：
# 主機每 5 分鐘讀 releases/latest，版本不同才下載換上（Plan 024 決策 028、032）。
name: release-site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-site-${{ github.ref }} # PR 與 main 各自排隊，PR 不會取消 main 的發佈
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # credits 要讀完整的 git 紀錄
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          SITE_URL: https://aifounders.tw
          GITHUB_TOKEN: ${{ github.token }} # 只有讀取權限，給抓頭像用
      - name: 打包
        run: |
          test -f dist/index.html
          if find dist ! -type f ! -type d | grep -q .; then echo "dist 只能有一般檔案與資料夾"; exit 1; fi
          tar -C dist -czf site.tar.gz .
          sha256sum site.tar.gz > site.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: site
          path: |
            site.tar.gz
            site.tar.gz.sha256
          retention-days: 7

  release:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
      - name: 發佈成 site-build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete site-build --cleanup-tag --yes || true
          gh release create site-build site.tar.gz site.tar.gz.sha256 \
            --target "$GITHUB_SHA" \
            --title "site-build ${GITHUB_SHA::7}" \
            --notes "Built from $GITHUB_SHA" \
            --latest
